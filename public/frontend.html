<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garage Admin Panel</title>
<style>
body { font-family:sans-serif; padding:20px; }
table { border-collapse: collapse; width:100%; margin-bottom:20px; }
th, td { border:1px solid #ccc; padding:8px; text-align:left; }
th { background:#eee; }
select, input { padding:4px; }
</style>
</head>
<body>
<h2>Garage Admin Panel</h2>

<h3>DB Summary</h3>
<ul>
<li>Users: <span id="usersCount">0</span></li>
<li>Services: <span id="servicesCount">0</span></li>
<li>Bookings: <span id="bookingsCount">0</span></li>
</ul>

<h3>Bookings Filters</h3>
<label>Status: <select id="statusFilter" onchange="updateTables()"><option value="">All</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label>
<label>Staff: <select id="staffFilter" onchange="updateTables()"><option value="">All</option></select></label>
<label>Customer: <input type="text" id="customerSearch" placeholder="Search by email" oninput="updateTables()"></label>

<h3>Bookings</h3>
<table id="bookingsTable"><thead><tr><th>ID</th><th>Customer</th><th>Service</th><th>Staff</th><th>Status</th><th>Date</th></tr></thead><tbody></tbody></table>
<div><button onclick="prevPage()">Previous</button> Page <span id="currentPage">1</span> <button onclick="nextPage()">Next</button></div>

<h3>Users</h3>
<table id="usersTable"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody></tbody></table>

<h3>Services</h3>
<table id="servicesTable"><thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Duration</th></tr></thead><tbody></tbody></table>

<script>
let currentPage=1, pageSize=20, staffUsers=[];

async function fetchDbSummary(){
  const res=await fetch("/db-summary");
  const s=await res.json();
  document.getElementById("usersCount").innerText=s.users;
  document.getElementById("servicesCount").innerText=s.services;
  document.getElementById("bookingsCount").innerText=s.bookings;
}

async function fetchUsers(){
  const res=await fetch("/users"); const users=await res.json();
  const tbody=document.getElementById("usersTable").querySelector("tbody"); tbody.innerHTML="";
  users.forEach(u=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${u.id}</td>
      <td contenteditable="true" onblur="updateUser(${u.id},'name',this.innerText)">${u.name}</td>
      <td contenteditable="true" onblur="updateUser(${u.id},'email',this.innerText)">${u.email}</td>
      <td><select onchange="updateUser(${u.id},'role',this.value)">
        <option value="customer" ${u.role==='customer'?'selected':''}>Customer</option>
        <option value="staff" ${u.role==='staff'?'selected':''}>Staff</option>
        <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
      </select></td>`;
    tbody.appendChild(tr);
  });
}

async function fetchStaffUsers(){
  const res=await fetch("/users"); const all=await res.json();
  staffUsers=all.filter(u=>u.role==='staff'); populateStaffFilter();
}

function populateStaffFilter(){
  const sel=document.getElementById("staffFilter"); sel.innerHTML=`<option value="">All</option>`+staffUsers.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
}
