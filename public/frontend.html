<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garage Admin Panel</title>
<style>
body { font-family:sans-serif; padding:20px; }
table { border-collapse: collapse; width:100%; margin-bottom:20px; }
th, td { border:1px solid #ccc; padding:8px; text-align:left; }
th { background:#eee; }
select, input { padding:4px; }
</style>
</head>
<body>
<h2>Garage Admin Panel</h2>

<h3>DB Summary</h3>
<ul>
<li>Users: <span id="usersCount">0</span></li>
<li>Services: <span id="servicesCount">0</span></li>
<li>Bookings: <span id="bookingsCount">0</span></li>
</ul>

<h3>Bookings Filters</h3>
<label>Status: <select id="statusFilter" onchange="updateTables()"><option value="">All</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label>
<label>Staff: <select id="staffFilter" onchange="updateTables()"><option value="">All</option></select></label>
<label>Customer: <input type="text" id="customerSearch" placeholder="Search by email" oninput="updateTables()"></label>

<h3>Bookings</h3>
<table id="bookingsTable"><thead><tr><th>ID</th><th>Customer</th><th>Service</th><th>Staff</th><th>Status</th><th>Date</th></tr></thead><tbody></tbody></table>
<div><button onclick="prevPage()">Previous</button> Page <span id="currentPage">1</span> <button onclick="nextPage()">Next</button></div>

<h3>Users</h3>
<table id="usersTable"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody></tbody></table>

<h3>Services</h3>
<table id="servicesTable"><thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Duration</th></tr></thead><tbody></tbody></table>

<script>
let currentPage=1, pageSize=20, staffUsers=[];

async function fetchDbSummary(){
  const res=await fetch("/db-summary");
  const s=await res.json();
  document.getElementById("usersCount").innerText=s.users;
  document.getElementById("servicesCount").innerText=s.services;
  document.getElementById("bookingsCount").innerText=s.bookings;
}

async function fetchUsers(){
  const res=await fetch("/users"); const users=await res.json();
  const tbody=document.getElementById("usersTable").querySelector("tbody"); tbody.innerHTML="";
  users.forEach(u=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${u.id}</td>
      <td contenteditable="true" onblur="updateUser(${u.id},'name',this.innerText)">${u.name}</td>
      <td contenteditable="true" onblur="updateUser(${u.id},'email',this.innerText)">${u.email}</td>
      <td><select onchange="updateUser(${u.id},'role',this.value)">
        <option value="customer" ${u.role==='customer'?'selected':''}>Customer</option>
        <option value="staff" ${u.role==='staff'?'selected':''}>Staff</option>
        <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
      </select></td>`;
    tbody.appendChild(tr);
  });
}

async function fetchStaffUsers(){
  const res=await fetch("/users"); const all=await res.json();
  staffUsers=all.filter(u=>u.role==='staff'); populateStaffFilter();
}

function populateStaffFilter(){
  const sel=document.getElementById("staffFilter"); sel.innerHTML=`<option value="">All</option>`+staffUsers.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
}

async function fetchServicesTable(){
  const res=await fetch("/services"); const services=await res.json();
  const tbody=document.getElementById("servicesTable").querySelector("tbody"); tbody.innerHTML="";
  services.forEach(svc=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${svc.id}</td>
      <td contenteditable="true" onblur="updateService(${svc.id},'name',this.innerText)">${svc.name}</td>
      <td contenteditable="true" onblur="updateService(${svc.id},'price',this.innerText)">${svc.price}</td>
      <td contenteditable="true" onblur="updateService(${svc.id},'duration',this.innerText)">${svc.duration}</td>`;
    tbody.appendChild(tr);
  });
}

async function fetchBookings(){
  const statusFilter=document.getElementById("statusFilter").value;
  const staffFilter=document.getElementById("staffFilter").value;
  const customerSearch=document.getElementById("customerSearch").value.toLowerCase();
  const res=await fetch(`/bookings?page=${currentPage}&pageSize=${pageSize}`);
  let data=await res.json(); let bookings=data.bookings;
  bookings=bookings.filter(b=>{
    return (!statusFilter || b.status===statusFilter) &&
           (!staffFilter || (b.staffId && b.staffId.toString()===staffFilter)) &&
           (!customerSearch || b.customer.email.toLowerCase().includes(customerSearch));
  });
  const tbody=document.getElementById("bookingsTable").querySelector("tbody"); tbody.innerHTML="";
  bookings.forEach(b=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${b.id}</td>
      <td>${b.customer.name} (${b.customer.email})</td>
      <td>${b.service.name}</td>
      <td><select onchange="updateBooking(${b.id},'staff',this.value)">
        <option value="">-</option>${staffUsers.map(s=>`<option value="${s.id}" ${b.staffId===s.id?'selected':''}>${s.name}</option>`).join('')}
      </select></td>
      <td><select onchange="updateBooking(${b.id},'status',this.value)">
        ${["pending","confirmed","completed","cancelled"].map(s=>`<option value="${s}" ${b.status===s?'selected':''}>${s}</option>`).join('')}
      </select></td>
      <td>${new Date(b.bookingDate).toLocaleString()}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById("currentPage").innerText=currentPage;
}

async function updateBooking(id,field,value){
  const body=field==='staff'?{staffId:value?Number(value):null}:{status:value};
  await fetch(`/bookings/${id}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  updateTables();
}

async function updateUser(id,field,value){
  const body={}; body[field]=field==="price"||field==="duration"?Number(value):value;
  await fetch(`/users/${id}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  updateTables();
}

async function updateService(id,field,value){
  const body={}; body[field]=field==="price"||field==="duration"?Number(value):value;
  await fetch(`/services/${id}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  updateTables();
}

function prevPage(){ if(currentPage>1){currentPage--;updateTables();} }
function nextPage(){ currentPage++;updateTables(); }

async function updateTables(){
  await fetchDbSummary();
  await fetchUsers();
  await fetchStaffUsers();
  await fetchServicesTable();
  await fetchBookings();
}

updateTables();
</script>
</body>
</html>
