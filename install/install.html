<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garage System Installation</title>
<style>
body { display:flex; justify-content:center; align-items:flex-start; min-height:100vh; font-family:sans-serif; background:#f4f4f4; padding:20px;}
.container { background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2); width:600px;}
input, button { width:100%; padding:10px; margin:10px 0; font-size:16px;}
#statusPanelContainer, #resetStatusPanelContainer { background:#eee; border-radius:5px; overflow:hidden; height:25px; margin-bottom:5px;}
#statusPanel, #resetStatusPanel { height:100%; width:0%; text-align:center; color:white;}
button.toggleBtn { margin:5px 0; padding:5px; font-size:14px; cursor:pointer;}
.console { background:#111; color:#0f0; height:150px; overflow-y:scroll; padding:10px; font-family:monospace; margin-bottom:10px;}
</style>
</head>
<body>
<div class="container">
  <h2>Garage System Setup</h2>

  <h3>Install</h3>
  <input type="text" id="dbUrl" placeholder="PostgreSQL Connection String">
  <button id="installBtn" onclick="install()">Install</button>
  <div id="statusPanelContainer">
    <div id="statusPanel" style="background:#f0a500;">0%</div>
  </div>
  <div id="statusText">Pending...</div>

  <button class="toggleBtn" onclick="toggleSection('installLog')">Installation Logs ▼</button>
  <div id="installLog" class="console"></div>

  <h3>Reset Database</h3>
  <input type="password" id="resetSecret" placeholder="Enter secret key">
  <button onclick="resetDb()">Reset Database</button>
  <div id="resetStatusPanelContainer">
    <div id="resetStatusPanel" style="background:#f0a500;">0%</div>
  </div>
  <div id="resetText">Idle...</div>

  <button class="toggleBtn" onclick="toggleSection('resetLog')">Reset Logs ▼</button>
  <div id="resetLog" class="console"></div>
</div>

<script>
function toggleSection(id){
  const el = document.getElementById(id);
  el.style.display = el.style.display==="none"?"block":"none";
}

function appendLog(sectionId, message, type="info"){
  const consoleEl = document.getElementById(sectionId);
  const time = new Date().toLocaleTimeString();
  const line = document.createElement("div");
  line.innerText = `[${time}] ${message}`;
  if(type==="error") line.style.color="#f55";
  else if(type==="success") line.style.color="#2d7a2d";
  else line.style.color="#0f0";
  consoleEl.appendChild(line);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

// Install SSE
function install() {
  const dbUrl = document.getElementById("dbUrl").value;
  if(!dbUrl) return alert("Enter database connection string");

  const bar = document.getElementById("statusPanel");
  const text = document.getElementById("statusText");

  bar.style.width="0%";
  text.innerText="Starting installation...";
  bar.style.background="#f0a500";
  document.getElementById("installLog").innerHTML="";

  const evtSource = new EventSource(`/install-progress?db=${encodeURIComponent(dbUrl)}`);
  let lines=0;

  evtSource.onmessage = e => {
    const msg = e.data;
    appendLog("installLog", msg, msg.startsWith("ERROR:") ? "error" : "info");
    if(!msg.startsWith("ERROR:")) {
      lines++;
      let percent = Math.min(95, lines*5);
      bar.style.width = percent+"%";
      text.innerText = msg;
    } else {
      bar.style.background="#a00";
      text.innerText = msg;
    }
  };

  evtSource.addEventListener("end", ()=>{
    bar.style.width="100%";
    bar.style.background="#2d7a2d";
    text.innerText="Installation complete!";
    appendLog("installLog","Installation complete!","success");
    document.getElementById("dbUrl").style.display="none";
    document.getElementById("installBtn").style.display="none";
    setTimeout(()=>window.location.href="/",2000);
    evtSource.close();
  });
}

// Reset SSE
function resetDb() {
  const secret = document.getElementById("resetSecret").value;
  if(!secret) return alert("Enter secret key");

  const bar = document.getElementById("resetStatusPanel");
  const text = document.getElementById("resetText");

  bar.style.width="0%";
  text.innerText="Starting reset...";
  bar.style.background="#f0a500";
  document.getElementById("resetLog").innerHTML="";

  const evtSource = new EventSource(`/reset-progress?secret=${encodeURIComponent(secret)}`);
  let lines=0;

  evtSource.onmessage = e => {
    const msg = e.data;
    appendLog("resetLog", msg, msg.startsWith("ERROR:") ? "error" : "info");
    if(!msg.startsWith("ERROR:")) {
      lines++;
      let percent = Math.min(95, lines*5);
      bar.style.width = percent+"%";
      text.innerText = msg;
    } else {
      bar.style.background="#a00";
      text.innerText = msg;
    }
  };

  evtSource.addEventListener("end", ()=>{
    bar.style.width="100%";
    bar.style.background="#2d7a2d";
    text.innerText="Reset complete!";
    appendLog("resetLog","Reset complete!","success");
    evtSource.close();
  });
}
</script>
</body>
</html>
